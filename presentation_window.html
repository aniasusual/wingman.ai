<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Presentation Summary</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #121212;
        color: #e0e0e0;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
      }

      #presentationContent {
        padding: 15px;
        line-height: 1.6;
        font-size: 14px;
        height: 90vh;
        overflow-y: auto;
        background: #1e1e1e;
        border-radius: 8px;
        border: 1px solid #333;
      }

      .loader {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: #e0e0e0;
        animation: spin 1s linear infinite;
        position: absolute;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .elegant-btn {
        margin-top: 10px;
        padding: 8px 12px;
        border-radius: 5px;
        background: linear-gradient(to right, #2a2a2a, #1a1a1a);
        color: #e0e0e0;
        border: 1px solid #333;
        cursor: pointer;
      }

      .elegant-btn:hover {
        background: linear-gradient(to right, #3a3a3a, #2a2a2a);
      }
    </style>
  </head>
  <body>
    <div id="presentationContent"><div class="loader"></div></div>
    <button id="downloadSummary" class="elegant-btn">Download Summary</button>
    <script src="presentation_window.js"></script>
  </body>
</html>
